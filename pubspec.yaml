name: hotel
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  http: ^1.2.1
  google_fonts: ^8.1.0
  table_calendar: ^3.1.2
  provider: ^6.1.2
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1

  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  objectbox_generator: any

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hotel1.png
    - assets/images/hotel2.png
    - assets/images/hotel3.png
    - assets/images/hotel4.png
    - assets/images/hotel5.png
    - assets/images/hotel6.png