name: Stayora
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  http: ^1.2.1
  google_fonts: ^8.1.0
  table_calendar: ^3.1.2
  provider: ^6.1.2
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  objectbox_generator: any
  flutter_lints: ^6.0.0
  # On place le package ici pour ne pas alourdir l'application finale
  flutter_launcher_icons: ^0.14.4

# La configuration se met tout en bas, alignée à l'extrême gauche
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
